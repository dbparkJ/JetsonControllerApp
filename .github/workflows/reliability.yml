name: Reliability checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'backend/**'
      - 'upload_receiver/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'docs/design/**'
      - 'docs/product/REQUIREMENTS_TRACEABILITY_KO.md'
      - 'docs/qa/**'
      - 'scripts/**'
      - '.github/workflows/reliability.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'backend/**'
      - 'upload_receiver/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'docs/design/**'
      - 'docs/product/REQUIREMENTS_TRACEABILITY_KO.md'
      - 'docs/qa/**'
      - 'scripts/**'
      - '.github/workflows/reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Slate Harmony source tokens and contrast
        run: python3 scripts/check_slate_harmony.py
      - name: Build, lint, and run the full JVM suite
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --max-workers=1 --console=plain
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install the Ubuntu Python runtime and native bindings
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-cryptography python3-dbus python3-gi python3-venv
      - name: Create the backend test environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .ci-backend-venv
          .ci-backend-venv/bin/pip install -r backend/requirements-dev.txt
      - name: Run the full backend suite
        run: PYTHONPATH=backend .ci-backend-venv/bin/python -m unittest discover -s backend/tests -p 'test_*.py' -v
  upload-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'upload_receiver/requirements*.txt'
      - name: Install receiver test dependencies
        run: python -m pip install -r upload_receiver/requirements-dev.txt
      - name: Run the full receiver suite
        run: PYTHONPATH=upload_receiver python -m unittest discover -s upload_receiver/tests -p 'test_*.py' -v
  qa-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check acceptance matrix coverage
        run: python3 scripts/check_qa_acceptance.py
