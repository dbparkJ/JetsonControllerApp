name: Reliability checks

on:
  pull_request:
    paths: ['app/**', 'backend/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/reliability.yml']
  push:
    branches: [main]
    paths: ['app/**', 'backend/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/reliability.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, lint, and focused regression tests
        run: >-
          ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
          --tests '*TransportCoordinatorTest'
          --tests '*AutomaticConnectionPolicyTest'
          --tests '*JetsonRepositoryStabilityTest'
          --tests '*LocalApiClientReplayTest'
          --tests '*ApiCompatibilityTest'
          --tests '*HttpAuthSignerTest'
          --tests '*LanAddressSelectionTest'
          --tests '*WifiNetworkSelectionTest'
          --tests '*UploadQueueFilterTest'
          --tests '*WifiDirectConnectionPolicyTest'
          --tests '*NavigationWorkflowTest'
          --tests '*DashboardHealthTest'
          --tests '*MetricPresentationTest'
          --tests '*DeviceWorkspaceTest'
          --tests '*UserConnectionStageTest'
          --tests '*PipelineConfigValueTest'
          --max-workers=1 --console=plain
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: pip install -r backend/requirements-dev.txt
      - name: Connection, snapshot, and API regressions
        working-directory: backend
        run: python -m unittest tests.test_wifi_direct tests.test_status tests.test_api
