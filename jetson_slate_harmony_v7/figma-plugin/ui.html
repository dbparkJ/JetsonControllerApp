<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{font:13px/1.6 system-ui,sans-serif;margin:0;padding:24px;background:#F7F5F2;color:#1D293B}h1{font-size:26px;margin:0}p{color:#5D687A}button{width:100%;border:0;padding:14px;border-radius:12px;background:#2456D8;color:white;font:600 14px system-ui;cursor:pointer;margin:10px 0}button:disabled{opacity:.5}select{width:100%;padding:12px;border:1px solid #D9DFE8;border-radius:10px}#status{padding:12px;background:#EDF1F7;border-radius:10px;white-space:pre-wrap}#downloads a{display:block;padding:10px;color:#2456D8;overflow-wrap:anywhere}small{font-size:11px;color:#5D687A}</style></head><body><h1>Slate Harmony.</h1><p>편집 가능한 Jetson Controller 화면 22개.<br>Auto Layout · 변수 · 텍스트 스타일 · 컴포넌트.</p><button id="build">새 디자인 생성</button><div id="status" role="status">현재 페이지에 별도 보드로 추가합니다. 기존 레이어는 삭제하지 않습니다. 외부 네트워크 요청은 없습니다.</div><p><label for="screen">PNG 내보내기</label></p><select id="screen" disabled></select><button id="export" disabled>선택 화면 PNG 생성 · 2배</button><div id="downloads"></div><small>생성이 끝나면 레이어와 줄바꿈을 확인하세요. 로컬 검사는 실제 Figma 렌더링 검증을 대체하지 않습니다. 생성 오류가 나면 오류 단계를 확인하고 Figma 실행 취소로 이번 생성분을 되돌릴 수 있습니다.</small><script>
const send=m=>parent.postMessage({pluginMessage:m},'*');let urls=[];document.querySelector('#build').onclick=()=>{document.querySelector('#build').disabled=true;send({type:'build'})};document.querySelector('#export').onclick=()=>{document.querySelector('#export').disabled=true;send({type:'export',key:document.querySelector('#screen').value})};
window.onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;const status=document.querySelector('#status');if(m.type==='progress')status.textContent=m.message;if(m.type==='error'){status.textContent='오류 · '+(m.stage||'')+'\n'+m.message;document.querySelector('#build').disabled=false;document.querySelector('#export').disabled=!document.querySelector('#screen').options.length;}if(m.type==='built'){status.textContent=`화면 ${m.screens.length}개 생성. 노드 ${m.createdNodes}개.\n컴포넌트 variant ${m.componentVariants}개.\n${m.warnings.length?'일부 프로토타입 링크 확인 필요: '+m.warnings.length+'개':'탭/상세 이동 링크 연결 완료.'}`;const sel=document.querySelector('#screen');sel.replaceChildren();m.screens.forEach(s=>{const o=document.createElement('option');o.value=s.key;o.textContent=s.key;sel.appendChild(o)});sel.disabled=false;document.querySelector('#export').disabled=false;}
if(m.type==='export'){const url=URL.createObjectURL(new Blob([new Uint8Array(m.bytes)],{type:'image/png'}));urls.push(url);const a=document.createElement('a');a.href=url;a.download=m.name;a.textContent=m.name+' 저장';document.querySelector('#downloads').appendChild(a);document.querySelector('#export').disabled=false;status.textContent='실제 Figma PNG가 생성됐습니다. 아래 저장 링크를 누르세요.';}};window.addEventListener('beforeunload',()=>urls.forEach(URL.revokeObjectURL));
</script></body></html>
