<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jetson Controller · Cobalt Field</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;background:#E7E9EF;color:#1D293B}button,select{font:inherit}button{cursor:pointer}#workspace{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;gap:64px;padding:36px 24px}aside{width:290px;padding:24px 0;position:sticky;top:24px;flex-shrink:0}aside h1{font-size:36px;line-height:1.1;letter-spacing:-1.8px;margin:20px 0}aside p{font-size:14px;line-height:1.8;color:#52617A}aside label{display:block;font-size:12px;font-weight:700;margin:24px 0 8px}aside select{width:100%;padding:12px;border:1px solid #C3CCDB;border-radius:10px;background:#F9FAFD}aside button{border:1px solid #C3CCDB;padding:10px 14px;border-radius:10px;background:#F9FAFD;margin:4px 2px}aside small{display:block;line-height:1.8;color:#52617A;margin-top:22px}#device{position:relative;width:412px;height:892px;box-shadow:0 22px 70px #172B4D25;outline:9px solid #172B4D;border-radius:28px;overflow:hidden;flex-shrink:0;background:#F7F5F2}#app{height:100%;width:100%}.node{box-sizing:border-box;min-width:0}.frame{display:flex;position:relative;flex-shrink:0}.text{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;flex-shrink:0;letter-spacing:-.2px}.icon{display:flex;align-items:center;justify-content:center;flex-shrink:0}.icon svg{width:100%;height:100%}[role=button]{cursor:pointer;user-select:none;outline-offset:3px}[role=button]:focus-visible{outline:3px solid #3977BC}[aria-disabled=true]{cursor:not-allowed}.scroll{overflow-x:hidden;overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.modal-overlay{position:absolute;inset:0;background:#101A3066;display:flex;align-items:center;justify-content:center;padding:24px;z-index:30;overflow:auto}#toast{position:absolute;z-index:99;bottom:92px;left:20px;right:20px;border-radius:14px;background:#172B4D;color:#fff;padding:14px 18px;font-size:13px;line-height:1.5;display:none}body.capture{background:transparent}body.capture #workspace{padding:0;display:block;min-height:0}body.capture aside{display:none}body.capture #device{width:100vw;height:100vh;box-shadow:none;outline:0;border-radius:0}body.capture #app{height:100vh}@media(max-width:820px){#workspace{padding:20px;gap:24px}aside{width:230px}}@media(max-width:680px){#workspace{display:block;padding:0}aside{display:none}#device{width:100vw;height:100dvh;outline:0;border-radius:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div id="workspace"><aside><div style="font-size:11px;letter-spacing:3px;font-weight:700">PRODUCT DESIGN / 2026</div><h1>Cobalt<br>Field.</h1><p>현장에서 중요한 것을 먼저.<br>작업 · 준비 상태 · 다음 행동에 집중하는<br>Jetson Controller 리디자인 시안입니다.</p><label for="screen">화면</label><select id="screen"></select><label>테마 · 가독성</label><button id="theme">밝게 / 어둡게</button><button id="font">글꼴 1.0 / 2.0</button><label>연결 상태</label><button id="offline">정상 / 연결 끊김</button><small>이 화면은 격리된 디자인 프로토타입입니다.<br>표시된 수치와 상태는 모두 데모입니다.<br>실제 장비 연결·명령·전송은 하지 않습니다.</small><small>제공 이미지: 로컬 HTML 렌더링.<br>Figma 내보내기 결과가 아닙니다.</small></aside><div id="device"><main id="app"></main><div id="toast" role="status"></div></div></div>
<script>
const SPEC=__SPEC__;
const params=new URLSearchParams(location.search);const capture=params.get('capture')==='1';if(capture)document.body.classList.add('capture');
const aliases={home:'01-home-light',tasks:'02-tasks',data:'03-data',settings:'04-settings','task-detail':'07-task-detail',sensors:'08-sensors',preflight:'09-preflight',connection:'11-connection',files:'16-data-files',devices:'17-device-picker',onboarding:'10-onboarding','reboot-confirm':'13-reboot-confirm','transfer-confirm':'14-transfer-confirm'};
let key=params.get('screen')||'01-home-light';if(aliases[key])key=aliases[key];let current,overrideTheme=params.get('theme'),overrideScale=params.has('scale')?Number(params.get('scale')):null,previous='01-home-light';let selection=new Set([0]);let overlayBack='';
function token(v,theme){return SPEC.themes[theme][v]||v}
function svg(name,color){return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${SPEC.icons[name]}</svg>`}
function expand(n){if(n.kind!=='component')return n;const d=JSON.parse(JSON.stringify(SPEC.components[n.component]));const walk=x=>{if(x.text)x.text=x.text.replace('{label}',n.props.label);(x.children||[]).forEach(walk)};walk(d);return {...d,name:n.name,action:n.action,component:n.component,style:{...d.style,...n.style}}}
function renderNode(raw,parentDir='v',path='root'){
 let n=expand(raw);let s={...n.style};if(current.scale>1.4&&['Actions','TaskActions','TaskMetrics','ReadinessTiles','QuickTools','DialogActions'].includes(n.name))s.dir='v';
 const el=document.createElement('div');el.className='node '+(n.kind==='text'?'text':n.kind==='icon'?'icon':'frame');el.dataset.name=n.name;el.dataset.path=path;el.dataset.kind=n.kind;el.dataset.designStyle=JSON.stringify(s);if(n.icon)el.dataset.icon=n.icon;if(n.action)el.dataset.action=n.action;if(n.component)el.dataset.component=n.component;
 const theme=current.theme,px=x=>x+'px';let css=el.style;
 if(n.kind==='text'){el.textContent=n.text;css.fontSize=px((s.size||14)*current.scale);css.fontWeight=s.weight||400;css.lineHeight=String(s.size>=20?1.32:1.5);css.color=token(s.color||'ink',theme);if(s.alignText)css.textAlign=s.alignText;}
 else if(n.kind==='icon'){el.innerHTML=svg(n.icon,token(s.color||'ink',theme));el.setAttribute('aria-hidden','true');}
 else{css.flexDirection=s.dir==='h'?'row':'column';css.gap=px(s.gap||0);css.alignItems=s.align==='center'?'center':s.align==='end'?'flex-end':(s.dir==='h'?'stretch':'stretch');if(s.justify)css.justifyContent={between:'space-between',center:'center',end:'flex-end'}[s.justify]||'flex-start';}
 if(s.w==='fill'){if(parentDir==='h'){css.flex='1 1 0';css.minWidth='0'}else{css.width='100%'}}else if(typeof s.w==='number'){css.width=px(s.w)}
 if(s.h!=null)css.height=px(s.h);if(s.minH!=null)css.minHeight=px(s.minH);if(s.grow){css.flex='1 1 0';css.minHeight='0'}if(s.shrink===0)css.flexShrink='0';
 if(s.bg)css.background=token(s.bg,theme);if(s.radius)css.borderRadius=px(s.radius);if(s.border)css.border='1px solid '+token(s.border,theme);if(s.borderTop)css.borderTop='1px solid '+token(s.borderTop,theme);if(s.opacity!=null)css.opacity=s.opacity;
 let pd=s.pad||0;css.paddingTop=px(s.padTop??s.padY??pd);css.paddingBottom=px(s.padBottom??s.padY??pd);css.paddingLeft=px(s.padX??pd);css.paddingRight=px(s.padX??pd);
 if(s.clip)css.overflow='hidden';if(s.scroll){el.classList.add('scroll');el.tabIndex=0;el.setAttribute('aria-label','화면 내용');}
 if(n.action||n.component?.includes('Button/')){el.setAttribute('role','button');el.tabIndex=n.action?0:-1;el.setAttribute('aria-disabled',n.action?'false':'true');if(n.aria)el.setAttribute('aria-label',n.aria);if(n.action){el.dataset.action=n.action;el.onclick=()=>act(n.action);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act(n.action)}}}}
 if(n.selected!==undefined){el.setAttribute('role','checkbox');el.setAttribute('aria-checked',String(selection.has(Number(n.action.split(':')[1]))));}
 (n.children||[]).forEach((c,i)=>el.appendChild(renderNode(c,s.dir||'v',path+'.'+i)));
 return el;
}
function render(next){
 key=next||key;const found=SPEC.screens.find(s=>s.key===key)||SPEC.screens[0];current={...found,theme:overrideTheme||found.theme,scale:overrideScale||found.scale};document.getElementById('app').replaceChildren(renderNode(current.tree));document.querySelector('#app>.node').style.width='100%';
 document.getElementById('screen').value=key;document.querySelectorAll('.modal-overlay').forEach(x=>x.remove());
 if(current.dialog)showModal(current.dialog);refreshSelections();window.currentScreen=key;
}
function showModal(d){const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','작업 확인');overlay.appendChild(renderNode(d,'v','dialog'));document.getElementById('device').appendChild(overlay);overlay.querySelector('[role=button]')?.focus();overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){act('cancel');return;}if(e.key==='Tab'){const f=[...overlay.querySelectorAll('[role=button]')];const i=f.indexOf(document.activeElement);const j=e.shiftKey?(i-1+f.length)%f.length:(i+1)%f.length;e.preventDefault();f[j].focus();}});}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function refreshSelections(){document.querySelectorAll('[data-action^="select:"]').forEach(el=>{const i=Number(el.dataset.action.split(':')[1]);el.setAttribute('aria-checked',selection.has(i));el.style.borderColor=token(selection.has(i)?'primary':'border',current.theme);el.querySelector('.icon').innerHTML=svg(selection.has(i)?'checked':'emptycheck',token('primary',current.theme));});const label=document.querySelector('[data-name="selectedLabel"]');if(label)label.textContent=`폴더 ${selection.size}개 선택`;const size=document.querySelector('[data-name="selectedSize"]');if(size)size.textContent=(selection.has(0)?42.8:0)+(selection.has(1)?11.6:0)>0?(((selection.has(0)?42.8:0)+(selection.has(1)?11.6:0)).toFixed(1)+' MB'):'선택 없음';}
function act(action){
 if(action.startsWith('select:')){const i=Number(action.split(':')[1]);selection.has(i)?selection.delete(i):selection.add(i);refreshSelections();return;}
 if(action==='clear-selection'){selection.clear();refreshSelections();return;}
 if(action==='theme'){overrideTheme=current.theme==='light'?'dark':'light';render();return;}
 if(action==='cancel'){render(overlayBack||previous||'01-home-light');return;}
 if(action==='transfer-confirm'){
  if(!selection.size){notify('전송할 폴더를 먼저 선택하세요.');return;}
  overlayBack=key;const d=JSON.parse(JSON.stringify(SPEC.screens.find(s=>s.key==='14-transfer-confirm').dialog));d.children[1].text=`폴더 ${selection.size}개를 전송할까요?`;d.children[2].text=`JETSON-01 → GEON 수집 서버\n선택한 폴더 ${selection.size}개 · ${((selection.has(0)?42.8:0)+(selection.has(1)?11.6:0)).toFixed(1)} MB\n장비의 원본 파일은 삭제하지 않습니다.`;showModal(d);return;
 }
 if(['stop-confirm','shutdown-confirm','forget-confirm'].includes(action)){overlayBack=key;let d=JSON.parse(JSON.stringify(SPEC.screens.find(s=>s.key==='13-reboot-confirm').dialog));d.children[1].text=action==='stop-confirm'?'야간 라인 검사를\n중지할까요?':action==='shutdown-confirm'?'JETSON-01을\n종료할까요?':'JETSON-01의\n등록을 삭제할까요?';d.children[2].text='이것은 시안용 확인창입니다.\n어떤 장비 명령도 전송하지 않습니다.';d.children[3].children[1].props.label=action==='stop-confirm'?'중지':action==='shutdown-confirm'?'전원 종료':'등록 삭제';d.children[3].children[1].action='confirmed-demo';showModal(d);return;}
 if(action.startsWith('confirmed-')||action==='start-demo'){document.querySelectorAll('.modal-overlay').forEach(x=>x.remove());notify('시안 동작 확인 · 실제 장비에는 요청하지 않았습니다.');return;}
 if(aliases[action]){previous=key;overlayBack=key;render(aliases[action]);return;}
 if(action==='camera'){notify('실제 영상 연결은 구현 단계에서 재연결합니다. 시안에는 가짜 LIVE 영상을 넣지 않았습니다.');return;}
 notify('이 화면은 시각·이동 검토용입니다. '+({retry:'실제 재연결은 앱 구현 단계에서 검증합니다.',scan:'카메라 권한과 QR 인증은 실제 앱에서 처리합니다.',search:'현재 장비의 로드된 목록 내 검색을 구현합니다.'}[action]||'상세 기능은 MD의 화면 계약에 따라 재연결합니다.'));
}
SPEC.screens.forEach(s=>{let o=document.createElement('option');o.value=s.key;o.textContent=s.key+' · '+s.title;document.getElementById('screen').appendChild(o)});
document.getElementById('screen').onchange=e=>render(e.target.value);document.getElementById('theme').onclick=()=>act('theme');document.getElementById('font').onclick=()=>{overrideScale=current.scale===1?2:1;render()};document.getElementById('offline').onclick=()=>render(key==='06-home-offline'?'01-home-light':'06-home-offline');
window.exportLayout=()=>[...document.querySelectorAll('#app .node')].map(e=>({path:e.dataset.path,name:e.dataset.name,rect:{x:e.getBoundingClientRect().x,y:e.getBoundingClientRect().y,width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height},scrollHeight:e.scrollHeight}));
window.act=act;window.SPEC=SPEC;render();
</script></body></html>
